version: '3.8'

services:
  app:
    # Menggunakan GHCR image resmi siap pakai atau build lokal dari Dockerfile
    image: ${DOCKER_IMAGE:-ghcr.io/ardianryan/jurnal-ekin-ai:smansage}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekinerja-ai
    restart: always
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - TZ=Asia/Jakarta
      # Kredensial Database PostgreSQL diambil dinamis dari .env (bebas hardcode)
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      # Volume data persisten kontainer untuk cache JSON, sesi & backup
      - ekinerja_data:/app/database

volumes:
  ekinerja_data:
